<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatted Date Timestamp</title>
</head>
<body>

    <h2>Formatted Timestamp:</h2>
    <p id="timestamp-output"></p>

    <script>
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const timestamp = `_${year}${month}${day}_${hours}${minutes}${seconds}`;

        // Output to the browser console
        console.log(timestamp);

        // Output directly onto the HTML page
        document.getElementById('timestamp-output').textContent = timestamp;
    </script>

</body>
</html>
